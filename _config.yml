# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve -l -H localhost`. If you change this file, please restart the
# server process.

# Basic Site Settings
locale: "en-US"
site_theme: "default"
title: "Zilang Chen"
title_separator: "-"
name: &name "Zilang Chen"
description: &description "M.S.E. student in Mechanical Engineering and Applied Mechanics at the University of Pennsylvania. Research interests: Robotics, Machine Learning, and Embodied Intelligence."
url: "https://zilangchen.github.io"
baseurl: "" # the subpath of your site, e.g. "/blog"
repository: "zilangchen/zilangchen.github.io"

# Site Author - The following control what appear as part of the author content on the side bar.
#               If a field is blank the icon and link will not appear, otherwise it will be shown.
#               Additional customization can be done by editing /_includes/author-profile.html
author:
  # Biographic information
  avatar: "profile.png"
  name: "Zilang Chen"
  pronouns: # example: "she/her"
  bio: "M.S.E. student in Mechanical Engineering and Applied Mechanics at the University of Pennsylvania. Interested in robotics, machine learning, and embodied intelligence."
  location: "Philadelphia, PA, USA"
  employer: "University of Pennsylvania"
  uri: # URL
  email: "zilang.chen@outlook.com"

  # Academic websites
  academia: # URL
  arxiv: # URL - Update with the correct link to your profile
  googlescholar: "https://scholar.google.com/citations?user=zOJdQf0AAAAJ&hl=en"
  impactstory: # URL
  # orcid: "http://orcid.org/yourorcidurl"
  semantic: # URL
  # pubmed: "https://www.ncbi.nlm.nih.gov/pubmed/?term=john+snow"
  researchgate: # URL
  scopus: # URL

  # Repositories and software development
  bitbucket: # Username - Update with your username on the site
  codepen: # Username
  dribbble: # Username
  github: "zilangchen"
  kaggle: # Username
  stackoverflow: # User number or user number and name (i.e., use "1" or "1/jeff-atwood")

  # Social media
  artstation: # Username
  bluesky:
  facebook: # Username
  flickr: # Username
  foursquare: # Username
  goodreads: # Username
  google_plus: # Username
  keybase: # Username
  instagram: # Username
  lastfm: # Username
  linkedin: # Username
  mastodon: # URL
  medium: # URL
  pinterest: # Username
  soundcloud: # Username
  steam: # Username
  telegram: # URL
  tumblr: # Username
  twitter: # Username for X / Twitter
  vine: # Username
  weibo: # Username
  wikipedia: # Username
  xing: # Username
  youtube: # Username
  zhihu: # Username

# Publication Category - The following the list of publication categories and their headings
publication_category:
  books:
    title: "Books"
  manuscripts:
    title: "Journal Articles"
  conferences:
    title: "Conference Papers"
  preprints:
    title: "Preprints"

# Site Settings
teaser: # filename of teaser fallback teaser image placed in /images/, .e.g. "500x300.png"
breadcrumbs: false # true, false (default)
words_per_minute: 160
future: false
read_more: "disabled" # if enabled, adds "Read more" links to excerpts
talkmap_link: false #change to true to add link to talkmap on talks page
comments:
  provider: # false (default), "disqus", "discourse", "facebook", "google-plus", "staticman", "custom"
  disqus:
    shortname:
  discourse:
    server: # https://meta.discourse.org/t/embedding-discourse-comments-via-javascript/31963 , e.g.: meta.discourse.org
  facebook:
    appid:
    num_posts: # 5 (default)
    colorscheme: # "light" (default), "dark"
staticman:
  allowedFields: ["name", "email", "url", "message"]
  branch: "gh-pages" # "master", "gh-pages"
  commitMessage: "New comment."
  filename: comment-{@timestamp}
  format: "yml"
  moderation: true
  path: "_data/comments/{options.slug}"
  requiredFields: ["name", "email", "message"]
  transforms:
    email: "md5"
  generatedFields:
    date:
      type: "date"
      options:
        format: "iso8601" # "iso8601" (default), "timestamp-seconds", "timestamp-milliseconds"
atom_feed:
  hide: true # disabled until the site publishes real posts
  path: # blank (default) uses feed.xml

# SEO Related
google_site_verification: "-niFTE1mqY_p-wCFZrDotBuV9nIQ8DHRMZOmRXUss_s"
bing_site_verification:
alexa_site_verification:
yandex_site_verification:

# Social Sharing
twitter:
  username: &twitter
facebook:
  username:
  app_id:
  publisher:
og_image: # Social media default site image
og_description: # Social media default site image description
# For specifying social profiles
# - https://developers.google.com/structured-data/customize/social-profiles
social:
  type: Person # Person or Organization (defaults to Person)
  name: "Zilang Chen" # If the user or organization name differs from the site's name
  links: # An array of links to social media profiles
    - "https://scholar.google.com/citations?user=zOJdQf0AAAAJ&hl=en"
    - "https://github.com/zilangchen"

# Analytics
analytics:
  provider: "false" # false (default), "google", "google-universal", "google-analytics-4", "custom"
  google:
    tracking_id:

# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - .DS_Store
  - AGENTS.md
  - CONTRIBUTING.md
  - Makefile
  - Materials
  - README.md
  - _posts
  - _talks
  - _teaching
  - development_record.md
  - docker-compose.yaml
  - embed_images.py
  - format_images.py
  - images/3953273590_704e3899d5_m.jpg
  - images/500x300.png
  - images/bio-photo-2.jpg
  - images/bio-photo.jpg
  - images/editing-talk.png
  - images/foo-bar-identity-th.jpg
  - images/foo-bar-identity.jpg
  - images/homepage.png
  - images/image-alignment-1200x4002.jpg
  - images/image-alignment-150x150.jpg
  - images/image-alignment-300x200.jpg
  - images/image-alignment-580x300.jpg
  - images/paragraph-indent.png
  - images/paragraph-no-indent.png
  - images/portfolio/deformation-reconstruction/video1.MP4
  - images/portfolio/temporal-logic-motion
  - images/site-logo.png
  - iteration.md
  - markdown_generator
  - objective.md
  - optimize_images.py
  - scripts
  - talkmap
  - talkmap.ipynb
  - talkmap.py
  - talkmap_out.ipynb
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# These settings control the types of collections used by the template
collections:
  teaching:
    output: false
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: false
    permalink: /:collection/:path/

# These settings control how pages and collections are included in the site
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  # _teaching
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  # _portfolio
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
      comment: true
  # _talks
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # http://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style

# Outputting
permalink: /:categories/:title/
# paginate: 5 # amount of posts to show
# paginate_path: /page:num/
timezone: Etc/UTC # http://en.wikipedia.org/wiki/List_of_tz_database_time_zones

# Plugins
plugins:
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Mimic GitHub Pages with --safe
whitelist:
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Archives
#  Type
#  - GitHub Pages compatible archive pages built with Liquid ~> type: liquid (default)
#  - Jekyll Archives plugin archive pages ~> type: jekyll-archives
#  Path (examples)
#  - Archive page should exist at path when using Liquid method or you can
#    expect broken links (especially with breadcrumbs enabled)
#  - <base_path>/tags/my-awesome-tag/index.html ~> path: /tags/
#  - <base_path/categories/my-awesome-category/index.html ~> path: /categories/
#  - <base_path/my-awesome-category/index.html ~> path: /
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
# https://github.com/jekyll/jekyll-archives
# jekyll-archives:
#   enabled:
#     - categories
#     - tags
#   layouts:
#     category: archive-taxonomy
#     tag: archive-taxonomy
#   permalinks:
#     category: /categories/:name/
#     tag: /tags/:name/

# HTML Compression
# - http://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development
